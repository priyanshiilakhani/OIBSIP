<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <!-- Google Fonts for clean typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Link to stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Centered Card Container -->
    <main class="converter-card">
        <!-- Heading -->
        <header class="header">
            <h1 class="app-title">Temperature Converter</h1>
        </header>

        <!-- Form Controls -->
        <div class="converter-form">
            <!-- Numeric Input Field -->
            <div class="form-group">
                <label for="tempInput">Temperature Value</label>
                <input 
                    type="number" 
                    id="tempInput" 
                    placeholder="Enter temperature" 
                    step="any"
                >
            </div>

            <!-- Input Unit Selector -->
            <div class="form-group">
                <label for="unitSelect">From Unit</label>
                <select id="unitSelect">
                    <option value="celsius">Celsius (°C)</option>
                    <option value="fahrenheit">Fahrenheit (°F)</option>
                    <option value="kelvin">Kelvin (K)</option>
                </select>
            </div>

            <!-- Output Unit Selector (Separate Control or All Units Simultaneously) -->
            <div class="form-group">
                <label for="outputUnitSelect">To Unit</label>
                <select id="outputUnitSelect">
                    <option value="all">All Units (Simultaneous)</option>
                    <option value="celsius">Celsius (°C)</option>
                    <option value="fahrenheit">Fahrenheit (°F)</option>
                    <option value="kelvin">Kelvin (K)</option>
                </select>
            </div>

            <!-- Convert Button -->
            <button type="button" id="convertBtn" class="convert-btn">
                Convert
            </button>
        </div>

        <!-- Error Message Display Area -->
        <div id="errorMessage" class="error-message" role="alert"></div>

        <!-- Result Display Area -->
        <section id="resultSection" class="result-section" aria-live="polite">
            <h2 class="result-heading">Converted Result</h2>
            <div id="resultsContainer" class="results-grid"></div>
        </section>
    </main>

    <!-- JavaScript -->
    <script src="script.js"></script>
</body>
</html>
